packages:
  - apps/*
  - packages/*
  - e2e

# Install scripts that may run: they fetch and check the esbuild and workerd binaries.
onlyBuiltDependencies:
  - esbuild
  - workerd

# Exact versions for the whole stack (docs/architecture.md section 2).
# Packages depend on them with "catalog:"; a version changes only here.
catalog:
  # Runtime
  '@codemirror/autocomplete': 6.20.4
  '@fontsource-variable/geist': 5.3.0 # shadcn CLI (Nova preset)
  '@codemirror/lang-python': 6.2.1
  '@tanstack/react-query': 5.108.0
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.44.2
  arctic: 3.7.0
  class-variance-authority: 0.7.1 # shadcn CLI
  cn: 0.5.2 # shadcn CLI
  codemirror: 6.0.2
  drizzle-orm: 0.45.4
  hono: 4.13.19
  i18next: 27.2.1
  lucide-react: 1.76.0 # shadcn CLI
  pyodide: 314.0.8
  radix-ui: 1.8.1 # shadcn CLI
  react: 19.3.1
  react-dom: 19.3.1
  react-i18next: 18.0.2
  react-markdown: 10.1.0
  react-router: 8.5.2
  tailwindcss: 4.3.5
  zod: 4.6.7
  # Build, test and lint (dev only)
  '@cloudflare/vitest-plugin': 1.8.5
  '@eslint/js': 10.0.1
  '@playwright/test': 1.65.1
  # Node types for the seed scripts, at the lowest supported Node (22)
  '@types/node': 22.20.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@tailwindcss/vite': 4.3.5
  # web unit tests; @testing-library/dom is a required peer of @testing-library/react
  '@testing-library/dom': 10.4.2
  '@testing-library/react': 16.3.3
  '@vitejs/plugin-react': 6.3.0
  drizzle-kit: 0.31.11
  jsdom: 31.0.1
  eslint: 10.15.0
  prettier: 3.10.1
  shadcn: 4.23.0 # its CLI; tailwind.css comes from this package
  # 6.0 is the newest TypeScript that typescript-eslint supports
  typescript: 6.0.3
  typescript-eslint: 8.73.0
  tw-animate-css: 1.4.0 # shadcn CLI
  # runs the TypeScript seed and check:i18n scripts (G16: a script runner)
  tsx: 4.23.15
  vite: 8.3.8
  vitest: 5.1.1
  wrangler: 4.165.0
